# Runs the server's type check and tests, and the client's checks and build, on every push and pull request, so a broken test shows
# as a red cross on GitHub instead of being found later.
name: CI

on:
  push:
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    # Every command below runs inside server/.
    defaults:
      run:
        working-directory: server
    steps:
      # Fetches the repository's code.
      - uses: actions/checkout@v7
      # Installs the Node version pinned in .node-version, and caches npm downloads
      # between runs using the lock file as the key.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: server/package-lock.json
      # Installs exactly what the lock file lists.
      - run: npm ci
      # Fails the build on a high or critical advisory in a package that ships to Render.
      # Dev-only tools (Vite, Vitest, TypeScript) are left out, since they never run in production.
      - run: npm audit --omit=dev --audit-level=high
      # tsc --noEmit: Node never checks types, so this step does.
      - run: npm run typecheck
      # Vitest, once, without watching.
      - run: npm test

  client:
    runs-on: ubuntu-latest
    # Every command below runs inside client/.
    defaults:
      run:
        working-directory: client
    steps:
      # Fetches the repository's code.
      - uses: actions/checkout@v7
      # Same Node as the server, with npm downloads cached on the client's lock file.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: client/package-lock.json
      # Installs exactly what the lock file lists.
      - run: npm ci
      # Fails the build on a high or critical advisory in a package that ships to Render.
      # Dev-only tools (Vite, Vitest, TypeScript) are left out, since they never run in production.
      - run: npm audit --omit=dev --audit-level=high
      # tsc on the client's own settings.
      - run: npm run typecheck
      # oxlint: likely bugs and React hook mistakes.
      - run: npm run lint
      # The same build Render runs, so a broken build shows here first.
      - run: npm run build
